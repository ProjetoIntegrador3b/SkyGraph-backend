services:
  neo4j:
    image: neo4j:5-community
    container_name: skygraph-neo4j
    restart: unless-stopped
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474' # HTTP / Neo4j Browser
      - '${NEO4J_BOLT_PORT:-7687}:7687' # Bolt
    environment:
      NEO4J_AUTH: neo4j/skygraph
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        ['CMD-SHELL', 'cypher-shell -u neo4j -p skygraph "RETURN 1" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - skygraph-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: skygraph-backend:latest
    container_name: skygraph-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-8000}:8000'
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: skygraph
      NEO4J_DATABASE: neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - skygraph-network

volumes:
  neo4j-data:
  neo4j-logs:

# Shared with the frontend stack. Create it once with:
#   docker network create skygraph-network
networks:
  skygraph-network:
    name: skygraph-network
    external: true
