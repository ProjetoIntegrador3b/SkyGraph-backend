name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Formatting runs first and never fails the job, so the warning is always
      # visible even when a later blocking step fails.
      # Formatting runs first and never fails the job, so the warning is always
      # visible even when a later blocking step fails. The file list comes from
      # git rather than ruff's output, which is not a stable machine format.
      - name: Check formatting (warning only)
        id: format
        run: |
          if ruff format --check .; then
            echo "formatted=true" >> "$GITHUB_OUTPUT"
          else
            echo "formatted=false" >> "$GITHUB_OUTPUT"
            ruff format . > /dev/null
            git diff --name-only > unformatted.txt
            git checkout -- .
          fi

      - name: Warn about unformatted files
        if: steps.format.outputs.formatted == 'false'
        run: |
          files="$(cat unformatted.txt)"
          rm -f unformatted.txt
          echo "::warning title=Ruff format::Some files are not formatted. Run 'ruff format .'."
          while IFS= read -r file; do
            [ -n "$file" ] && echo "::warning file=${file},title=Ruff format::Not formatted. Run 'ruff format .'."
          done <<< "$files"
          {
            echo "### :warning: Formatting (non-blocking)"
            echo
            echo "These files are not formatted:"
            echo
            echo '```'
            echo "$files"
            echo '```'
            echo
            echo "Run \`ruff format .\` to fix. This does **not** block the pull request."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Test
        run: pytest -q

  docker:
    name: Docker stack builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create shared network
        run: docker network create skygraph-network

      - name: Start the stack
        run: docker compose up -d --build

      - name: Smoke test the API against a real Neo4j
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8000/api/hello; then break; fi
            sleep 2
          done
          echo "--- /api/hello ---"
          curl -sf http://localhost:8000/api/hello
          echo
          echo "--- /api/health ---"
          curl -sf http://localhost:8000/api/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
